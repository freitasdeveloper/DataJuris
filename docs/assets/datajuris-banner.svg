  <text x="82" y="35" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="800" letter-spacing="-1.8">data<tspan fill="#9de5c8">juris</tspan></text>
  <text x="84" y="60" fill="#c8e8df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">CONHECIMENTO JURÍDICO</text>
</g>
<text x="80" y="205" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="750" letter-spacing="-1.2">Seu conhecimento.</text>
<text x="80" y="251" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="750" letter-spacing="-1.2">Mais estratégico.</text>
<text x="82" y="291" fill="#d1e8e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Pesquisa, organização e produtividade para a rotina jurídica.</text>
