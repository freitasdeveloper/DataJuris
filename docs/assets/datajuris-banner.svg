<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">DataJuris — conhecimento jurídico em movimento</title>
<desc id="desc">Banner em azul petróleo, verde água e dourado, com símbolo jurídico abstrato e cartões de documentos.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b35"/><stop offset=".58" stop-color="#164c52"/><stop offset="1" stop-color="#167d76"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ce0c4"/><stop offset="1" stop-color="#d5f3a5"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d58a"/><stop offset="1" stop-color="#e9a94d"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d8fff1" opacity=".15"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#061b20" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/><rect width="1200" height="360" rx="26" fill="url(#dots)"/>
<circle cx="1090" cy="54" r="190" fill="#b6f0d9" opacity=".07"/><circle cx="1000" cy="350" r="230" fill="#e8bf73" opacity=".08"/>
<g transform="translate(78 78)">
