name: DataJuris Database Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: datajuris-database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Supabase migrations and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start clean local Supabase stack
        run: supabase start

      - name: Run database security tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
